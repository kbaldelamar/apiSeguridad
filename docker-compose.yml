version: '3.8'

services:
  # Servicio de la API de autenticación
  auth_api:
    build: .
    container_name: auth_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=mysql+mariadb://auth_user:auth_password@mariadb:3306/auth_db
      - SECRET_KEY=your-secret-key-in-production-this-should-be-secure
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
      - USE_MARIADB_CONNECTOR=True
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - auth_network
    restart: unless-stopped

  # Servicio de base de datos MariaDB
  mariadb:
    image: mariadb:latest
    container_name: auth_mariadb
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=auth_db
      - MYSQL_USER=auth_user
      - MYSQL_PASSWORD=auth_password
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - auth_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "auth_user", "-pauth_password"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Servicio para administración de base de datos (opcional)
  adminer:
    image: adminer:latest
    container_name: auth_adminer
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mariadb
    depends_on:
      - mariadb
    networks:
      - auth_network
    restart: unless-stopped

networks:
  auth_network:
    driver: bridge

volumes:
  mariadb_data: